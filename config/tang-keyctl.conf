# /etc/tang-keyctl.conf

# This server's URL, exactly as the clients' Clevis bindings use it.
# Several URLs (e.g. IP address and DNS name) are separated by spaces.
# The first one must also work from this server: it checks its own advertisement there.
# Urls can be found via `/usr/bin/clevis luks list -d /dev/sda3` where sda3 would be the encrypted partition
# The first URL must be reachable from the tang server itself for the tang_advertisement_ok metric to work
# In case your TANG server is behind a NAT without reflexion, you may use http://localhost:7500
TANG_URLS="http://xx.xx.xx.xx:7500 http://yy.yy.yy.yy:7500"

# Retired keys are kept at least MIN_AGE_DAYS, and until no client used them for QUIET_DAYS.
MIN_AGE_DAYS=90
QUIET_DAYS=14

# Textfile collector is enabled for node exporter via `node_exporter --collector.textfile.directory`
TEXTFILE_DIR=/var/lib/node_exporter/textfile_collector
